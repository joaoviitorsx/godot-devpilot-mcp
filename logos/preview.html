<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GodoPilot — conceitos de ícone</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem; font: 16px/1.5 system-ui, sans-serif; background: #f3f6f9; color: #263c52; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; }
    h1 { margin: 0; font-size: 1.65rem; }
    button { border: 1px solid currentColor; border-radius: 8px; padding: .55rem .8rem; color: inherit; background: transparent; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.25rem; }
    .card { border: 1px solid #cbd8e1; border-radius: 16px; overflow: hidden; background: white; }
    .art { display: grid; place-items: center; height: 250px; padding: 25px; }
    .art img { width: 200px; height: 200px; }
    .details { padding: 1rem; border-top: 1px solid #e0e8ed; }
    .details strong { display: block; }
    .sizes { display: flex; align-items: end; gap: 1rem; padding-top: 1rem; }
    .sizes span { display: grid; gap: .2rem; text-align: center; font-size: .75rem; }
    .sizes img { object-fit: contain; }
    body.dark { background: #182736; color: #e9f4fc; }
    body.dark .card { background: #284057; border-color: #4a677c; }
    body.dark .details { border-color: #4a677c; }
  </style>
</head>
<body>
  <header><h1>GodoPilot — conceitos de ícone</h1><button type="button" onclick="document.body.classList.toggle('dark')">Alternar tema</button></header>
  <div class="grid">
    <article class="card"><div class="art"><img src="concepts/concept-1.svg" alt="Mascote piloto"></div><div class="details"><strong>1 · Piloto</strong>Mascote com capacete, visor e pequena seta de navegação.<div class="sizes"><span><img src="concepts/concept-1.svg" width="64" height="64">64 px</span><span><img src="concepts/concept-1.svg" width="32" height="32">32 px</span><span><img src="concepts/concept-1.svg" width="16" height="16">16 px</span></div></div></article>
    <article class="card"><div class="art"><img src="concepts/concept-2.svg" alt="Mascote bússola"></div><div class="details"><strong>2 · Bússola</strong>Guia em forma de pin, com rosto e agulha de direção.<div class="sizes"><span><img src="concepts/concept-2.svg" width="64" height="64">64 px</span><span><img src="concepts/concept-2.svg" width="32" height="32">32 px</span><span><img src="concepts/concept-2.svg" width="16" height="16">16 px</span></div></div></article>
    <article class="card"><div class="art"><img src="iterations/iteration-1.svg" alt="Mascote controle de jogo selecionado"></div><div class="details"><strong>3 · Controle — escolhido</strong>Mascote inspirado em gamepad, com olhos e botões simples.<div class="sizes"><span><img src="iterations/iteration-1.svg" width="64" height="64">64 px</span><span><img src="iterations/iteration-1.svg" width="32" height="32">32 px</span><span><img src="iterations/iteration-1.svg" width="16" height="16">16 px</span></div></div></article>
  </div>
</body>
</html>
